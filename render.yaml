services:
  - type: web
    name: fusedle-live
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Your EulerStream Sign API Key. Set it in Render's dashboard (Environment tab).
      - key: EULERSTREAM_SIGN_API_KEY
        sync: false
      # Your TikTok username (no @). With BOTH variables set, the game connects
      # to your LIVE by itself every time it starts.
      - key: TIKTOK_USERNAME
        sync: false
      - key: CHAT_DEBUG_LOG
        value: "false"
    # Optional (paid plan): keep all-time scores across deploys by attaching a
    # Persistent Disk and setting DATA_DIR to its folder.
    # disk:
    #   name: fusedle-data
    #   mountPath: /var/data
    #   sizeGB: 1
