# Render Blueprint - optional. You can also create the Web Service by hand
# (Build: npm install   Start: npm start)
services:
  - type: web
    name: fusion-associations-live
    runtime: node
    plan: starter            # free tier sleeps after 15 min idle -> would drop the live chat connection
    buildCommand: npm install   # the frontend builds automatically via the postinstall script
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MODE              # test | live | offline  (switchable later at /control)
        value: live
      - key: TIKTOK_USERNAME   # your TikTok @handle WITHOUT the @ (set in Render dashboard)
        sync: false
      - key: ADMIN_KEY         # password for /control (auto-generated, view it in Render > Environment)
        generateValue: true
